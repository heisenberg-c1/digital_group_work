[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docscan"
version = "0.1.0"
description = "手机文档扫描与可读性增强系统"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scipy>=1.11",
    "pillow>=10.0",
    "pypdfium2>=4.0",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
theme = ["sv-ttk>=2.6"]
dnd = ["tkinterdnd2>=0.4"]
dev = [
    "pytest>=8",
    "pytest-cov",
    "scikit-image>=0.22",
    "ruff",
    "pyinstaller>=6.0",
]

[project.scripts]
docscan = "docscan.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]  # 中文注释含全角标点，非歧义字符

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["slow: 12MP 端到端基准，默认跳过"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["docscan.core"]
